{% extends "base.html" %}
{% block title %}Инструкция — M22 Product Radar{% endblock %}
{% block content %}
<div class="card" style="max-width:1100px"><div class="doc">{{ body | safe }}</div></div>
<style>.doc h1{margin-top:0}.doc h2{margin-top:22px;padding-top:10px;border-top:1px solid var(--line)}.doc h3{margin:14px 0 4px}.doc p,.doc li,.doc td,.doc th{font-size:14px;line-height:1.5}.doc ul{padding-left:20px}.doc .toc{font-size:13px;margin-bottom:10px;line-height:1.8}.doc code{background:var(--accent-bg);padding:0 4px;border-radius:4px}.doc table{margin:6px 0 10px}</style>
{% endblock %}
