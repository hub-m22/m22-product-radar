services:
  radar:
    build: .
    image: m22-radar:latest
    container_name: m22-radar
    # Автозапуск: контейнер поднимается при старте Docker (после перезагрузки VPS) и после любого падения.
    # Сборы, анализ и отчёты запускает планировщик внутри процесса (radar/scheduler.py) — отдельный cron не нужен.
    restart: always
    env_file: .env
    environment:
      RADAR_HOST: 0.0.0.0
      TZ: Europe/Moscow
    volumes:
      - ./data:/app/data        # база, сырые страницы, экспорт, резервные копии — вне контейнера
    ports:
      - "127.0.0.1:8022:8022"  # наружу только через nginx с авторизацией
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8022/health', timeout=8).status == 200 else 1)"]
      interval: 60s
      timeout: 10s
      start_period: 40s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
